<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farming Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            gap: 15px;
        }

        .stat-box {
            background: #667eea;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            text-align: center;
            flex: 1;
        }

        .stat-box h3 {
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .stat-box .value {
            font-size: 1.8em;
            font-weight: bold;
        }

        .farm {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .plot {
            aspect-ratio: 1;
            background: #8B7355;
            border: 3px solid #654321;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2em;
            transition: transform 0.2s;
        }

        .plot:hover {
            transform: scale(1.05);
        }

        .plot.planted {
            background: #90EE90;
        }

        .plot.ready {
            background: #FFD700;
        }

        .info-text {
            text-align: center;
            color: #666;
            font-size: 0.9em;
            margin-bottom: 20px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
        }

        button:hover {
            background: #764ba2;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Farming Game</h1>

        <div class="stats">
            <div class="stat-box">
                <h3>Money</h3>
                <div class="value" id="money">$100</div>
            </div>
            <div class="stat-box">
                <h3>Day</h3>
                <div class="value" id="day">1</div>
            </div>
            <div class="stat-box">
                <h3>Harvests</h3>
                <div class="value" id="harvests">0</div>
            </div>
        </div>

        <div class="info-text" id="info">Click a plot to plant a seed ($10)</div>

        <div class="farm" id="farm"></div>

        <div class="buttons">
            <button onclick="nextDay()">Next Day</button>
            <button onclick="resetGame()">Reset</button>
        </div>
    </div>

    <script>
        const SEED_COST = 10;
        const CROP_PRICE = 50;
        const GROWTH_DAYS = 3;

        let gameState = {
            money: 100,
            day: 1,
            harvests: 0,
            plots: []
        };

        function initPlots() {
            for (let i = 0; i < 16; i++) {
                gameState.plots.push({
                    state: 'empty',
                    daysPlanted: 0
                });
            }
        }

        function render() {
            const farmDiv = document.getElementById('farm');
            farmDiv.innerHTML = '';
            
            gameState.plots.forEach((plot, index) => {
                const plotDiv = document.createElement('div');
                plotDiv.className = 'plot ' + plot.state;
                
                if (plot.state === 'planted') {
                    plotDiv.textContent = 'Growing...';
                } else if (plot.state === 'ready') {
                    plotDiv.textContent = 'Ready!';
                }
                
                plotDiv.onclick = function() { clickPlot(index); };
                farmDiv.appendChild(plotDiv);
            });

            document.getElementById('money').textContent = '$' + gameState.money;
            document.getElementById('day').textContent = gameState.day;
            document.getElementById('harvests').textContent = gameState.harvests;
        }

        function clickPlot(index) {
            const plot = gameState.plots[index];

            if (plot.state === 'empty') {
                if (gameState.money >= SEED_COST) {
                    plot.state = 'planted';
                    plot.daysPlanted = 0;
                    gameState.money -= SEED_COST;
                    document.getElementById('info').textContent = 'Seed planted! Water it.';
                } else {
                    document.getElementById('info').textContent = 'Not enough money!';
                }
            } else if (plot.state === 'planted') {
                plot.state = 'planted';
                document.getElementById('info').textContent = 'Crop growing! Use Next Day button.';
            } else if (plot.state === 'ready') {
                plot.state = 'empty';
                plot.daysPlanted = 0;
                gameState.money += CROP_PRICE;
                gameState.harvests++;
                document.getElementById('info').textContent = 'Harvested! Earned $50!';
            }

            render();
        }

        function nextDay() {
            gameState.day++;
            gameState.plots.forEach(plot => {
                if (plot.state === 'planted') {
                    plot.daysPlanted++;
                    if (plot.daysPlanted >= GROWTH_DAYS) {
                        plot.state = 'ready';
                    }
                }
            });
            document.getElementById('info').textContent = 'Day ' + gameState.day + '! Crops growing...';
            render();
        }

        function resetGame() {
            gameState = {
                money: 100,
                day: 1,
                harvests: 0,
                plots: []
            };
            initPlots();
            document.getElementById('info').textContent = 'Game reset!';
            render();
        }

        initPlots();
        render();
    </script>
</body>
</html>
